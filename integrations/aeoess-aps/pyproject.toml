[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeoess-aps-integration"
version = "0.1.0"
description = "Maps signed Agent Passport System policy decisions onto TRACE Trust Records and verifies AuthorityDelegationV1 chains separately"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  # 0.10.0 is the floor: verify_record enforces the full v0.2 schema from
  # that release, which is what makes this integration's partial record a
  # documented boundary rather than an accident. See the round-trip tests.
  "agentrust-trace>=0.10.0",
  # 4.0.0 is the floor: agent_passport.verify_authority_delegation_chain,
  # AuthorityValidationResult and AuthorityFailure, and the issuance helpers
  # delegation_verify's own fixtures use, do not exist before that release.
  "agent-passport-system>=4.0",
]

[project.optional-dependencies]
test = [
  "pytest",
  "agentrust-trace-tests>=0.4",
]

[tool.setuptools]
py-modules = ["aps_trace", "delegation_verify"]
